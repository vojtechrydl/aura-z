<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0518" />
    <meta name="description" content="Aura Z — hexagonový kvíz pro Gen Z. Spoj všechny tři strany trojúhelníku dřív než soupeř." />
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong theme; useTheme.ts re-applies/keeps this in sync afterwards.
      (function () {
        try {
          if (localStorage.getItem('aura-z-theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light')
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Aura Z</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
